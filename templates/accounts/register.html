{% extends 'base.html' %}

{% block title %}注册 - 安居乐{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">用户注册</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="phone" name="phone" maxlength="11">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password2" class="form-label">确认密码</label>
                            <input type="password" class="form-control" id="password2" name="password2" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">用户角色</label>
                        <select class="form-select" id="role" name="role">
                            <option value="resident" selected>小区住户</option>
                            <option value="property_admin">物业管理员</option>
                            <option value="third_party">第三方服务商</option>
                        </select>
                        <div class="form-text">超级管理员需后台配置</div>
                    </div>
                    <div class="mb-3">
                        <label for="community" class="form-label">所属小区（可选）</label>
                        <select class="form-select" id="community" name="community">
                            <option value="">-- 选择小区 --</option>
                            {% for community in communities %}
                            <option value="{{ community.id }}">{{ community.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">注册</button>
                </form>
                <div class="mt-3 text-center">
                    <p>已有账号？<a href="{% url 'user-login' %}">立即登录</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
