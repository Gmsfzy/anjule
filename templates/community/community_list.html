{% extends 'base.html' %}

{% block title %}小区管理 - 安居乐{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">创建新小区</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">小区名称</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">小区地址</label>
                        <input type="text" class="form-control" id="address" name="address" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="developer" class="form-label">开发商</label>
                            <input type="text" class="form-control" id="developer" name="developer">
                        </div>
                        <div class="col-md-6">
                            <label for="property_company" class="form-label">物业公司</label>
                            <input type="text" class="form-control" id="property_company" name="property_company">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">创建小区</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">小区列表</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>地址</th>
                                <th>物业公司</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for community in communities %}
                            <tr>
                                <td>{{ community.name }}</td>
                                <td>{{ community.address }}</td>
                                <td>{{ community.property_company|default:'-' }}</td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="3" class="text-center">暂无小区数据</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
